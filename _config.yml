# Site identity
title: Last Shift Coffee
tagline: Cold coffee reviews from the Valleys.
description: Coffee from Welsh and UK roasters, reviewed as cold brew and cold-pressed espresso, with a 1 to 5 bean score.
author: Stuart Nightingale
lang: en-GB

url: https://www.lastshiftcoffee.co.uk
baseurl: ""
permalink: /:year/:month/:title.html
paginate: 9
paginate_path: "/blog/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope: { type: posts }
    values: { layout: post }

navigation:
  - title: Reviews
    url: /reviews/
  - title: My Setup
    url: /p/my-cold-brew-coffee-setup.html
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

google_analytics: "G-N4SS677RZE"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - _vendor
  - vendor
  - Blogger
  - scripts
  - brand
